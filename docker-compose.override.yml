services:
  backend:
    volumes:
      - ./backend:/app
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

  stagehand-runner:
    volumes:
      - ./stagehand-runner/runs:/app/runs

  browser-use-runner:
    volumes:
      - ./browser-use-runner/runs:/app/runs

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_BACKEND_URL: http://backend:8000
