services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      RUNNER_URL: http://browser-use-runner:8008
      RUNNER_RUNS_DIR: /app/runs
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./browser-use-runner/runs:/app/runs
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    networks: [qa-net]

  browser-use-runner:
    build: ./browser-use-runner
    env_file: .env
    platform: linux/amd64
    ports:
      - "8008:8008"
    volumes:
      - ./browser-use-runner:/app
      - ./browser-use-runner/runs:/app/runs
      - /app/.venv
    shm_size: '2gb'
    networks: [qa-net]

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_BACKEND_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    depends_on:
      - backend
    networks: [qa-net]

networks:
  qa-net:

volumes:
  frontend_node_modules:
