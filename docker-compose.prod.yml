services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      RUNNER_URL: http://browser-use-runner:8008
      RUNNER_RUNS_DIR: /app/runs
    ports:
      - "8000:8000"
    volumes:
      - browser_runs:/app/runs
    networks: [qa-net]

  browser-use-runner:
    build: ./browser-use-runner
    env_file: .env
    platform: linux/amd64
    ports:
      - "8008:8008"
    volumes:
      - browser_runs:/app/runs
    shm_size: '2gb'
    networks: [qa-net]

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks: [qa-net]

networks:
  qa-net:

volumes:
  browser_runs:
